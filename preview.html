<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #10121a; }
        #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

        #rb-loading {
            position: absolute; inset: 0; z-index: 30; display: flex;
            align-items: center; justify-content: center;
            background: #10121a; color: #8a93a8;
            font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        #rb-controls {
            position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
            z-index: 20; display: flex; align-items: center; gap: 10px;
        }
        #rb-run {
            cursor: pointer; border: 0; border-radius: 999px; padding: 9px 20px;
            background: #6ee7a8; color: #06301b;
            font: 600 14px system-ui, -apple-system, 'Segoe UI', sans-serif;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
        }
        #rb-run:hover { background: #8af0bd; }
        #rb-run[disabled] { background: #3a4152; color: #8a93a8; cursor: default; }

        /* Whatever the program prints, plus any Python error. Students print to
           debug, so this is part of watching the program run. */
        #rb-console {
            position: absolute; left: 10px; top: 10px; z-index: 20;
            max-width: 46%; max-height: 40%; overflow: hidden;
            background: rgba(10, 14, 26, .82);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 8px; padding: 7px 10px;
            font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #cdd5e2; white-space: pre-wrap;
        }
        #rb-console.err { color: #ffb4a8; border-color: rgba(255, 120, 100, .45); }
        .rb-gone { display: none !important; }
        #rb-stubs { display: none; }
    </style>
</head>

<body>
    <!-- Read-only robot preview for the share page and the gallery modal.
         The adapter captures a Babylon screenshot, so a static render adds
         nothing. The value is watching the student's PROGRAM run: the robot
         driving the world under its own code.

         index.html loads 44 scripts. Numbers 2-3 (Ace), 9-10 (pep, jszip) and
         39-44 (the panels, main and help) are the editor; everything else is
         the runtime, and that is what this page loads. No editor exists, so
         nothing has to be hidden or disabled.

         The program is compiled HEADLESSLY. Saved projects carry blockly XML
         and an empty pythonCode, so the Python is generated here through a bare
         Blockly.Workspace (no inject, no toolbox, no DOM) and the app's own
         ev3dev2/pybricks generator, then handed to Skulpt. -->
    <canvas id="renderCanvas"></canvas>

    <div id="rb-console" class="rb-gone"></div>
    <div id="rb-controls">
        <button id="rb-run" class="rb-gone" type="button">&#9654; Run the program</button>
    </div>
    <div id="rb-loading">Loading robot...</div>
    <div id="rb-stubs"></div>

    <script>
        /* Ahead of the app scripts: js/skulpt.js reports progress and errors
           through simPanel, which is an editor panel this page does not load.
           Three methods is the whole surface. */
        /* babylon.js registers its OWN DOMContentLoaded handler that configures
           Ammo's wasm path (locateFile) and then calls babylon.init. So this
           page must NOT call babylon.init itself, and this flag has to be set
           before that handler runs, which is why it lives up here: it tells
           babylon.init to skip loading the default robot and world, because the
           saved ones replace them. */
        window._platformProjectPending = true;

        var simPanel = {
            consoleWrite: function (text) { window.__rbConsole && window.__rbConsole(text, false); },
            consoleWriteErrors: function (text) { window.__rbConsole && window.__rbConsole(text, true); },
            setRunIcon: function (type) { window.__rbRunIcon && window.__rbRunIcon(type); }
        };
    </script>

    <script src="jquery/jquery-3.5.1.slim.min.js"></script>
    <script src="skulpt/0.11.0/skulpt.min.js"></script>
    <script src="skulpt/0.11.0/skulpt-stdlib.js"></script>
    <script src="ammo/ammo-20210414.wasm.js"></script>
    <script src="babylon/4.2.1/babylon.js"></script>
    <script src="babylon/4.2.1/babylonjs.loaders.min.js"></script>
    <script src="js/msg.js"></script>
    <script src="js/common/widgets.js"></script>
    <script src="blockly-9.0.0/blockly.js"></script>
    <script src="blockly-9.0.0/blocks.js?v=revert20260302"></script>
    <script src="blockly-9.0.0/python.js"></script>
    <script src="js/ev3dev2_generator.js"></script>
    <script src="js/pybricks_generator.js"></script>
    <script src="js/blockly.js?v=dragfix20260302"></script>
    <script src="js/skulpt.js"></script>
    <script src="js/worlds/World_Base.js?v=4"></script>
    <script src="js/worlds/world_Grid.js"></script>
    <script src="js/worlds/world_LineFollowing.js"></script>
    <script src="js/worlds/world_Gyro.js"></script>
    <script src="js/worlds/world_Paintball.js"></script>
    <script src="js/worlds/world_Sumo.js"></script>
    <script src="js/worlds/world_FireRescue.js"></script>
    <script src="js/worlds/world_Maze.js"></script>
    <script src="js/worlds/world_Missions.js"></script>
    <script src="js/worlds/world_Custom.js"></script>
    <script src="js/worlds/world_Football.js"></script>
    <script src="js/worlds/world_Arena.js"></script>
    <script src="js/worlds/extra/world_challenges.js"></script>
    <script src="js/robotComponents.js?v=2"></script>
    <script src="js/robotTemplates.js"></script>
    <script src="js/Wheel.js?v=3"></script>
    <script src="js/Robot.js?v=3"></script>
    <script src="js/sensorVisualization.js"></script>
    <script>
        /* index.html creates the robot in an inline block at exactly this point,
           between sensorVisualization.js and babylon.js, and babylon.init reads
           it immediately. Loading the files without this glue leaves `robot`
           undefined and the scene never builds. */
        var robots = [];
        var robot = new Robot();
        robot.options = JSON.parse(JSON.stringify(robotTemplates[0]));
        robot.player = 'single';
        robots.push(robot);
    </script>
    <script src="js/babylon.js"></script>

    <script>
    (function () {
        'use strict';

        /* renderCanvas is real; the other two are the only ids the runtime
           scripts reach for. */
        ['simPanel', 'toolbox'].forEach(function (id) {
            if (document.getElementById(id)) return;
            var el = document.createElement('div');
            el.id = id;
            document.getElementById('rb-stubs').appendChild(el);
        });

        window.confirm = function () { return true; };
        window.alert = function () {};

        var loaded = false;
        var running = false;
        var programCode = null;
        var consoleLines = [];

        function el(id) { return document.getElementById(id); }

        window.__rbConsole = function (text, isError) {
            if (text === undefined || text === null) return;
            consoleLines.push(String(text));
            if (consoleLines.length > 12) consoleLines.shift();
            var box = el('rb-console');
            box.textContent = consoleLines.join('').slice(-1200);
            box.classList.remove('rb-gone');
            box.classList.toggle('err', !!isError);
        };

        window.__rbRunIcon = function (type) {
            /* Skulpt calls this with 'run' when the program ends by itself. */
            if (type === 'run') setRunning(false);
        };

        function setRunning(on) {
            running = on;
            el('rb-run').innerHTML = on
                ? '&#9632; Stop'
                : '&#9654; Run the program';
        }

        /* Compile the saved blocks to Python without any editor. A bare
           Blockly.Workspace takes the XML; the app's own generator turns it
           into the same code the Python panel would have shown. */
        function compileProgram(data) {
            return blockly.loadCustomBlocks().then(function () {
                var ws = new Blockly.Workspace();
                blockly.workspace = ws;
                var dom = Blockly.Xml.textToDom(data.blocklyXml || '<xml></xml>');
                Blockly.Xml.domToWorkspace(dom, ws);

                /* genCode always returns the imports and motor setup, so an
                   empty project still yields non-empty Python. A workspace
                   holding only the `when_started` hat is a project with no
                   program, and the button should say so rather than doing
                   nothing when pressed. */
                if (ws.getAllBlocks(false).length <= 1) return null;

                blockly.generator = (data.generatorMode === 'pybricks' && typeof pybricks_generator !== 'undefined')
                    ? pybricks_generator
                    : ev3dev2_generator;
                blockly.generator.load();

                /* A saved pythonCode wins, since the student edited it directly
                   and the blocks are then stale. It is empty on every project
                   saved so far, but the format allows it. */
                if (data.pythonModified && data.pythonCode) return data.pythonCode;
                return blockly.generator.genCode();
            });
        }

        /* Ammo compiles its wasm asynchronously and babylon.init only runs once
           that resolves, so the scene appears some time after the scripts do. */
        function whenBabylonReady() {
            return new Promise(function (resolve) {
                var tries = 0;
                (function wait() {
                    if (typeof babylon !== 'undefined' && babylon.scene) return resolve();
                    if (tries++ > 400) return resolve();   // give up, restore will no-op
                    setTimeout(wait, 50);
                })();
            });
        }

        /* The restore sequence the platform adapter uses, minus the editor
           panels: robot options first, then the world, then one resetScene
           once the world's async option load has settled. */
        function restoreScene(data) {
            if (data.robotOptions && typeof robot !== 'undefined') {
                robot.options = JSON.parse(JSON.stringify(data.robotOptions));
            }

            var optionsReady = Promise.resolve();
            if (data.worldConfig && data.worldConfig.worldName && typeof worlds !== 'undefined') {
                var world = worlds.find(function (w) { return w.name === data.worldConfig.worldName; });
                if (world) {
                    babylon.world = world;
                    if (typeof world.setOptions === 'function' && data.worldConfig.options) {
                        optionsReady = world.setOptions(data.worldConfig.options);
                    }
                }
            }
            return optionsReady.then(function () {
                /* resetScene starts the render loop itself when `main` is
                   undefined, which it is here: that guard was written for
                   exactly this no-editor case. */
                return babylon.resetScene();
            });
        }

        function wireRun() {
            var btn = el('rb-run');
            btn.classList.remove('rb-gone');
            if (!programCode) {
                btn.setAttribute('disabled', 'disabled');
                btn.textContent = 'No program in this project';
                return;
            }
            btn.addEventListener('click', function () {
                if (!running) {
                    consoleLines = [];
                    el('rb-console').classList.add('rb-gone');
                    setRunning(true);
                    try {
                        robot.reset();
                        skulpt.runPython(programCode);
                        if (babylon.world && typeof babylon.world.startSim === 'function') {
                            babylon.world.startSim();
                        }
                    } catch (e) {
                        console.warn('[robotics-preview] run failed', e);
                        setRunning(false);
                    }
                } else {
                    skulpt.hardInterrupt = true;
                    setRunning(false);
                    try { robot.reset(); } catch (e) {}
                }
            });
        }

        function initPreview(data) {
            if (loaded) return;
            loaded = true;

            try { skulpt.init(); } catch (e) { console.warn('[robotics-preview] skulpt init failed', e); }

            whenBabylonReady()
                .then(function () { return restoreScene(data); })
                .then(function () { return compileProgram(data); })
                .then(function (code) { programCode = (code || '').trim() ? code : null; })
                .catch(function (e) { console.warn('[robotics-preview] setup failed', e); })
                .then(function () {
                    el('rb-loading').classList.add('rb-gone');
                    wireRun();
                    window.parent.postMessage({ type: 'PREVIEW_LOADED' }, '*');
                });
        }

        window.addEventListener('message', function (e) {
            var msg = e.data;
            if (!msg || msg.type !== 'LOAD_PREVIEW' || loaded) return;
            var data = msg.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { data = null; }
            }
            if (!data) {
                el('rb-loading').classList.add('rb-gone');
                window.parent.postMessage({ type: 'PREVIEW_LOADED' }, '*');
                return;
            }
            initPreview(data);
        });

        window.parent.postMessage({ type: 'PREVIEW_READY' }, '*');
    })();
    </script>
</body>

</html>
